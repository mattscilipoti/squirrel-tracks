name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web-frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build version
        run: |
          commit_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:'%Y-%m-%d %H:%M')
          cat > web-frontend/js/version.js <<VERSION
          window.APP_VERSION = Object.freeze({
            commit: "${GITHUB_SHA}",
            date: "${commit_date} UTC",
            repo: "${GITHUB_REPOSITORY}",
          });
          VERSION

      - name: Remove test files from the published site
        run: rm -f web-frontend/js/*.test.cjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-frontend

      - id: deployment
        uses: actions/deploy-pages@v4
