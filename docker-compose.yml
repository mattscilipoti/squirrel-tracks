version: "3.8"

services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    container_name: ett-dev

    working_dir: /workspaces/squirrel_tracks

    volumes:
      - .:/workspaces/squirrel_tracks
      - bundle_cache:/workspaces/squirrel_tracks/bundle
      - ${HOME}/.ssh:/home/vscode/.ssh:ro

    ports:
      - "3000:3000" # Rails API
      - "5000:5000" # Web Frontend

    environment:
      - RAILS_ENV=development
      - BUNDLE_PATH=/workspaces/squirrel_tracks/bundle

    command: /bin/bash

    stdin_open: true
    tty: true

    networks:
      - ett-network

volumes:
  bundle_cache:
    driver: local

networks:
  ett-network:
    driver: bridge
