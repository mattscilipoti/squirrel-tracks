<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergent Task Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Emergent Task Tracker</h1>
            <p class="subtitle">Track your time in 15-minute intervals</p>
        </header>

        <main>
            <!-- Timer Section -->
            <section class="timer-section">
                <div class="timer-display">
                    <div class="time" id="timerDisplay">15:00</div>
                    <div class="controls">
                        <button id="startBtn" class="btn btn-primary">Start</button>
                        <button id="pauseBtn" class="btn btn-secondary" disabled>Pause</button>
                        <button id="resetBtn" class="btn btn-tertiary">Reset</button>
                    </div>
                </div>
            </section>

            <!-- Task Input Section -->
            <section class="task-input-section">
                <label for="taskInput">Current Task:</label>
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="What are you working on?" 
                    class="input-field"
                >
                <button id="logTaskBtn" class="btn btn-primary">Log Task</button>
            </section>

            <!-- Interval Bubble Grid (15 bubbles = 15 min intervals) -->
            <section class="bubbles-section">
                <h2>Time Intervals</h2>
                <div class="bubble-grid" id="bubbleGrid">
                    <!-- Bubbles generated by JS -->
                </div>
            </section>

            <!-- Session Summary -->
            <section class="summary-section">
                <h2>Session Summary</h2>
                <div id="summaryContent" class="summary-content">
                    <!-- Summary data populated by JS -->
                </div>
                <button id="exportBtn" class="btn btn-secondary">Export (CSV)</button>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Emergent Task Tracker. <a href="https://davidseah.com/2006/04/the-printable-ceo-iii-emergent-task-timing/">About ETT</a></p>
        </footer>
    </div>

    <script src="js/api-client.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
